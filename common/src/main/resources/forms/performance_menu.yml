bedrock:
  type: "SIMPLE"
  title: "§e§l⚡ Performance Benchmarks"
  content: "§7Test performance with various loads"
  buttons:
    light_load:
      text: "§a§l🟢 Light Load (3 actions)"
      onClick:
        - |
          message {
            - "§a§lLight load test starting..."
          }
        - |
          sound {
            - "ui.button.click"
          }
        - |
          actionbar {
            - "§a§lLight load complete!"
          }

    medium_load:
      text: "§e§l🟡 Medium Load (6 actions)"
      onClick:
        - |
          message {
            - "§e§lMedium load test starting..."
          }
        - |
          sound {
            - "ui.button.click"
            - "entity.experience_orb.pickup:0.8:1.0"
          }
        - |
          economy {
            - "add:50"
            - "check:50"
          }
        - |
          actionbar {
            - "§e§lMedium load complete!"
          }

    heavy_load:
      text: "§c§l🔴 Heavy Load (10+ actions)"
      onClick:
        - |
          message {
            - "§c§l=== HEAVY LOAD TEST ==="
            - "§7Executing maximum action sequence..."
          }
        - |
          sound {
            - "ui.button.click"
            - "entity.experience_orb.pickup:0.5:1.0"
            - "block.note_block.harp:1.0:0.8"
            - "entity.firework_rocket.launch:0.7:1.5"
            - "entity.player.levelup:1.0:1.0"
          }
        - |
          actionbar {
            - "§aHeavy Load 1/8"
            - "§bHeavy Load 2/8"
            - "§cHeavy Load 3/8"
            - "§dHeavy Load 4/8"
            - "§eHeavy Load 5/8"
            - "§fHeavy Load 6/8"
            - "§1Heavy Load 7/8"
            - "§2Heavy Load 8/8 - DONE!"
          }
        - |
          economy {
            - "add:100"
            - "add:200"
            - "add:300"
            - "check:600"
          }
        - |
          command {
            - "me completed heavy load test part 1"
            - "me completed heavy load test part 2"
            - "me completed heavy load test part 3"
          }
        - |
          server {
            - "say §c{player} §ecompleted heavy load test!"
            - "broadcast §6Performance test completed by {player}!"
          }
        - |
          title {
            - "§c§lHEAVY LOAD:§a§lCOMPLETE!:20:100:20"
          }
        - |
          message {
            - "§a§l=== HEAVY LOAD TEST COMPLETED ==="
            - "§eAll systems handled the load successfully!"
            - "§bCheck console for detailed performance metrics"
          }

    back_advanced_perf:
      text: "§7← Back to Advanced"
      onClick:
        - |
          open {
            - "advanced_test_menu"
          }
